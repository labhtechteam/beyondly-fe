
name: Deploy Website

on:
  push:
    branches:
      - production
      - staging

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.DEPLOY_TOKEN }}
          external_repository: >-
            YOUR_USERNAME/${{
              github.ref_name == 'main' && 'beyondly-prod' ||
              github.ref_name == 'staging' && 'beyondly-staging' ||
              'beyondly-dev'
            }}
          publish_branch: gh-pages
          publish_dir: ./
